stages:
  - .pre
  - test
  - deploy

docker-build:
  extends: .docker-dind
  stage: .pre
  # Default branch leaves tag empty (= latest tag)
  # All other branches are tagged with the escaped branch name (commit ref slug)
  script:
      - apk add --update make && apk add --update bash && apk add --update sudo && apk add --update git && apk add --update curl
      - echo "DOCKER_TAG value = $DOCKER_TAG"
      - echo "CI_COMMIT_SHA = $CI_COMMIT_SHA"
      - make build-docker DOCKER_TAG=$CI_COMMIT_SHA
  # Run this job in a branch where a Dockerfile exists
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      exists:
        - Dockerfile
    - changes:
      - requirements.txt
      - Dockerfile
      - Makefile

test:
  # Reuse built container.
  image: ${DOCKER_REPO}/${DOCKER_NAME}:${DOCKER_IMAGE_TAG}
  stage: test
  tags:
    - autoscale
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - export KSM_CONFIG=$KSM_CONFIG
    - export SECRET_UID=$SECRET_KEY_UID
    - export S3_ACCESS_KEY=$(ksm secret get -u $SECRET_UID --field "Access Key")
    - export S3_SECRET_KEY=$(ksm secret get -u $SECRET_UID --field "Secret Key")
    - mkdir -p kmer
    - |
      cat > ~/.s3cfg <<EOF
      [default]
      encrypt = False
      access_key = $S3_ACCESS_KEY
      secret_key = $S3_SECRET_KEY
      host_base = $HOST_BASE
      host_bucket = $HOST_BUCKET
      use_https = True
      EOF
    - s3cmd get s3://primer-designer/ci-cd-test-data/kmer-lists/homo_sapiens_11.list kmer/
    - s3cmd get s3://primer-designer/ci-cd-test-data/kmer-lists/homo_sapiens_16.list kmer/
    - ls kmer
  script:
    - python -m unittest discover --start-directory ./tests --top-level-directory .
  dependencies:
    - docker-build

docker-release:
  extends: .docker-dind
  stage: deploy
  before_script:
    - apk add --update bash git curl
  script:
    - git fetch origin main
    - |
      if ! git branch -r --contains $CI_COMMIT_SHA | grep origin/main; then
      echo "Tag commit is not in main branch"
      exit 1
      fi
    - echo "Building release image for tag $CI_COMMIT_TAG"
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  rules:
    - !reference [.release_on_version_tag, rules]

.docker-dind:
  image: docker:23.0.6
  tags:
    - autoscale
  services:
    - name: docker:23.0.6-dind
      alias: thedockerhost
  variables:
    DOCKER_HOST: tcp://thedockerhost:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

.release_on_version_tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never    
